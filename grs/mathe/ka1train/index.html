<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Tolga Guerdal">
<title>KA-Training Mathematik: Blatt 1 bis 6</title>
<style>
:root{--blau:#1f3a5f;--rot:#c00000;--h1:#2e7d32;--h2:#b58900;--h3:#c62828;--rand:#d0d0d0;--grau:#555;--bg:#f6f6f4}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,Helvetica,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;color:#111;background:var(--bg)}
header{background:var(--blau);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
#uhr{font-weight:bold;font-variant-numeric:tabular-nums;background:#fff;color:var(--blau);border-radius:6px;padding:4px 8px;font-size:15px;white-space:nowrap}
#uhr:empty{display:none}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
.card{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:12px 14px;margin:10px 0}
h2{font-size:19px;margin:0 0 8px;color:var(--blau)}
h2 .pkt{display:block;font-size:14px;font-weight:normal;color:var(--grau)}
p{margin:6px 0}ul{margin:6px 0;padding-left:22px}li{margin:4px 0}
.klein{font-size:14px;color:var(--grau)}
.knopfe{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{font:inherit;font-size:16px;padding:10px 14px;border-radius:8px;border:2px solid #999;background:#fff;color:#111;cursor:pointer;min-height:44px}
button[disabled]{opacity:.45;cursor:default}
button.haupt{background:var(--blau);border-color:var(--blau);color:#fff;font-weight:bold;flex:1 1 100%}
button.pruef{background:var(--blau);border-color:var(--blau);color:#fff;font-weight:bold;flex:1 1 100%}
button.hilfeknopf{flex:1 1 30%;font-size:15px;padding:10px 4px;white-space:nowrap}
button.hilfeknopf.naechste{color:#fff;font-weight:bold}
button.hilfeknopf.naechste.b1{background:var(--h1);border-color:var(--h1)}
button.hilfeknopf.naechste.b2{background:var(--h2);border-color:var(--h2);color:#222}
button.hilfeknopf.naechste.b3{background:var(--h3);border-color:var(--h3)}
button.hilfeknopf.erledigt{background:#f4f4f4;font-weight:600}
button.wegknopf{flex:1 1 100%;border-color:var(--rot);color:var(--rot);font-weight:bold}
.nav{display:flex;gap:8px;align-items:center;margin:8px 0}
.nav button{flex:0 0 auto;min-width:48px;font-weight:bold;color:var(--blau);border-color:var(--blau)}
.nav .mitte{flex:1;text-align:center;font-weight:bold;color:var(--blau)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{min-height:40px;min-width:40px;padding:6px 8px;font-size:15px}
.chips button.hier{background:var(--blau);color:#fff;border-color:var(--blau)}
.chips button.da{border-color:var(--h1);box-shadow:inset 0 -4px 0 var(--h1)}
.block{border-top:1px solid var(--rand);margin-top:12px;padding-top:10px}
.teil{margin:6px 0}
.reihe{display:block;font-weight:bold;margin:6px 0 6px 14px}
.ersatz{background:#fff8e1;border-left:4px solid var(--h2);padding:6px 10px;border-radius:4px;font-style:italic}
.feld{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.feld label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=text]{font:inherit;font-size:18px;width:7.2em;padding:8px;border:2px solid #777;border-radius:8px;background:#fff}
input.ok{border-color:var(--h1);background:#eef7ee}input.falsch{border-color:var(--h3);background:#fdeeee}
.mark{font-weight:bold;font-size:15px}.mark.ok{color:var(--h1)}.mark.falsch{color:var(--h3)}
.gitter{display:grid;grid-template-columns:1fr;gap:2px 16px}
@media(min-width:640px){.gitter{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--rand);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input{width:22px;height:22px;flex:0 0 auto}
.opt.ok{border-color:var(--h1);background:#eef7ee}.opt.falsch{border-color:var(--h3);background:#fdeeee}
figure{margin:8px 0;text-align:center}figcaption{font-size:14px;font-weight:bold}
svg.bild{width:100%;max-width:400px;height:auto;display:block;margin:0 auto}
svg.bild text{font:bold 15px Arial,Helvetica,sans-serif;fill:#111}
svg.bild .k{stroke:#111;stroke-width:2.2;fill:none}svg.bild .f{fill:#e9e9e9}
svg.bild .d{stroke:#111;stroke-width:1.2;fill:none}svg.bild .s{stroke:#111;stroke-width:1.4;stroke-dasharray:6 5;fill:none}
svg.bild .sand{fill:#cfcfcf;stroke:#111;stroke-width:1}svg.bild .rohr{fill:#fff}
.fb{margin:8px 0;font-weight:bold}.fb.ok{color:var(--h1)}.fb.falsch{color:var(--h3)}
.hilfe{border-left:6px solid var(--h1);background:#f3f8f3;padding:8px 10px;border-radius:4px;margin:8px 0}
.hilfe.h2{border-color:var(--h2);background:#fbf7ea}.hilfe.h3{border-color:var(--h3);background:#fbf0f0}
.loes{border:2px solid var(--rot);border-radius:8px;margin:10px 0;overflow:hidden}
.loes-kopf{background:var(--rot);color:#fff;font-weight:bold;padding:6px 10px}
.loes .zeile{padding:6px 10px;border-top:1px solid #f0d0d0}
.fo{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:18px;background:#f1f4f8;border:1px solid #d5dbe5;border-radius:4px;padding:1px 6px;display:inline-block;margin:2px 0}
details{margin:10px 0}summary{cursor:pointer;font-weight:bold;color:var(--blau);padding:8px 0}
table.form{border-collapse:collapse;width:100%}table.form td{border:1px solid var(--rand);padding:6px 8px;vertical-align:top}
table.erg{border-collapse:collapse;width:100%;font-size:16px}table.erg td,table.erg th{border-bottom:1px solid var(--rand);padding:6px 4px;text-align:left}
table.erg td.z,table.erg th.z{text-align:right;white-space:nowrap}
.gross{font-size:26px;font-weight:bold;color:var(--blau)}
.ueb{background:#fff8e1;border-radius:6px;padding:6px 10px;margin:6px 0}
.liste button{flex:1 1 100%;text-align:left}
.liste .z{float:right;color:var(--h1);font-size:14px}
.leer{display:inline-block;min-width:6em;border-bottom:1.5px solid #111;height:1.3em;vertical-align:bottom}
.rechenfeld{border:1px solid #999;height:1.7cm;margin:6px 0;border-radius:4px}.eu{white-space:nowrap}
.nurdruck{display:none}
@media print{header,.nodruck,.nav,.chips{display:none!important}body{background:#fff;font-size:10.5pt;line-height:1.3}main{max-width:none;padding:0}.card{border:0;border-bottom:1px solid #999;border-radius:0;padding:3px 0;margin:4px 0}.block{break-inside:avoid;margin-top:5px;padding-top:4px}.feld{margin:3px 0}.rechenfeld{height:1.4cm}p{margin:3px 0}.nurdruck{display:block}svg.bild{max-width:5.5cm}figure{margin:2px 0}.card h2{font-size:13pt}}
</style>
</head>
<body>
<header><h1>KA-Training Mathematik</h1><span id="uhr"></span></header>
<main id="app"></main>
<script>
'use strict';
/* KA-Training Mathematik, Blatt 1 bis 6. Eine Datei, keine fremden Adressen. Autor: Tolga Guerdal */
const KEY='grs-mathe-ka1train-v1',DAUER=80,NB=' ';

/* ---------- Zahlen ---------- */
function fx(x,n){const f=Math.pow(10,n);return Math.round(x*f+(x>=0?1e-7:-1e-7))/f}
function grp(g){return g.length>3?g.replace(/\B(?=(\d{3})+(?!\d))/g,NB):g}
function de(x,n){if(n===undefined)n=2;let s=fx(x,n).toFixed(n),neg=s[0]==='-';if(neg)s=s.slice(1);const p=s.split('.');return(neg?'−':'')+grp(p[0])+(p[1]?','+p[1]:'')}
function kz(x){let s=fx(x,4).toFixed(4).replace(/0+$/,'').replace(/\.$/,''),neg=s[0]==='-';if(neg)s=s.slice(1);const p=s.split('.');return(neg?'−':'')+grp(p[0])+(p[1]?','+p[1]:'')}
function lies(s){if(s==null)return NaN;s=String(s).replace(/[\s ]/g,'').replace('−','-');if(s==='')return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const m=s.match(/^-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN}
function ok(v,soll,tol){return isFinite(v)&&Math.abs(v-soll)<=tol+1e-9}
const LEN={mm:1,cm:10,dm:100,m:1000,km:1e6},FL={'mm²':1,'cm²':100,'dm²':1e4,'m²':1e6};
function um(v,a,b){const T=a in LEN?LEN:FL;return fx(v*T[a]/T[b],6)}
const M=x=>de(x)+NB+'m',M2=x=>de(x)+NB+'m²',M3=x=>de(x)+NB+'m³',E=(x,u)=>kz(x)+NB+u;
const fo=s=>'<span class="fo">'+s+'</span>';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
const step=(a,b,s)=>fx(a+s*ri(0,Math.round((b-a)/s)),4);

/* ---------- Skizzen (SVG) ---------- */
const svg=(w,h,i)=>`<svg viewBox="0 0 ${w} ${h}" class="bild" role="img" xmlns="http://www.w3.org/2000/svg">${i}</svg>`;
const tx=(x,y,t,a)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}">${t}</text>`;
const tick=(x,y)=>`<line x1="${x-4}" y1="${y+4}" x2="${x+4}" y2="${y-4}" class="d"/>`;
const massH=(x1,x2,y,t,pos)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="d"/>${tick(x1,y)}${tick(x2,y)}${tx((x1+x2)/2,pos==='u'?y+18:y-7,t)}`;
const massV=(x,y1,y2,t,s)=>`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" class="d"/>${tick(x,y1)}${tick(x,y2)}${tx(s==='l'?x-8:x+8,(y1+y2)/2+5,t,s==='l'?'end':'start')}`;
function bild2(d){return{cap:'Maße in m und cm; Rohrdurchmesser in mm',svg:svg(320,238,
  `<line x1="15" y1="40" x2="105" y2="40" class="k"/><line x1="215" y1="40" x2="305" y2="40" class="k"/><polyline points="105,40 105,205 215,205 215,40" class="k"/>`+
  `<rect x="105" y="183" width="110" height="22" class="sand"/><circle cx="160" cy="159" r="24" class="k rohr"/>`+
  massV(245,40,205,de(d.tiefe),'r')+massV(80,183,205,kz(d.sand),'l')+massV(160,40,135,'x','r')+tx(160,230,'Rohr Ø '+kz(d.rohr)+' mm'))}}
function bild3(d){const re=fx(d.B-d.ch,4),ob=fx(d.L-d.cw,4),x0=60,y0=38,W=210,H=150,cw=d.cw*W/d.L,ch=d.ch*H/d.B;
  const p=[[x0,y0+H],[x0+W,y0+H],[x0+W,y0+ch],[x0+W-cw,y0+ch],[x0+W-cw,y0],[x0,y0]].map(q=>fx(q[0],1)+','+fx(q[1],1)).join(' ');
  return{cap:'Hof von oben; Maße in m',svg:svg(340,225,`<polygon points="${p}" class="k f"/>`+tx(x0+W/2,y0+H+20,de(d.L))+tx(x0+W+8,fx(y0+ch+(H-ch)/2+5,1),de(re),'start')+
  tx(fx(x0+W-cw/2,1),fx(y0+ch+18,1),de(d.cw))+tx(fx(x0+W-cw-8,1),fx(y0+ch/2+5,1),de(d.ch),'end')+tx(fx(x0+(W-cw)/2,1),y0-8,de(ob))+tx(x0-8,y0+H/2+5,de(d.B),'end'))}}
function bild4(d,nr){return{cap:'Lageplan M 1 : 500; Planmaße in cm; ablesen, nicht messen',svg:svg(340,215,
  `<rect x="20" y="165" width="300" height="36" class="f"/>`+tx(170,189,'Tannenstraße')+`<rect x="80" y="45" width="170" height="120" class="k" style="fill:#fff"/>`+tx(165,112,'Nr. '+nr)+
  massH(80,250,28,kz(d.plan[0])+' cm','o')+massV(275,45,165,kz(d.plan[1])+' cm','r'))}}
function bild6(d){return{cap:'Querschnitt des Damms; Maße in m',svg:svg(340,208,`<polygon points="30,165 310,165 220,65 120,65" class="k f"/>`+massH(120,220,45,de(d.kr),'o')+
  `<line x1="170" y1="65" x2="170" y2="165" class="s"/>`+tx(178,120,de(d.h),'start')+tx(84,100,'1 : 1,5','end')+tx(256,100,'1 : 1,5','start')+massH(30,310,186,'?','u'))}}
function bild7(d){const x0=55,y0=45,W=230,H=140,a=fx((d.L-d.ob)*W/d.L,1),b=fx((d.B-d.re)*H/d.B,1);
  return{cap:'Stellfläche von oben; Maße in m',svg:svg(340,215,`<polygon points="${x0},${y0} ${x0+W-a},${y0} ${x0+W},${y0+b} ${x0+W},${y0+H} ${x0},${y0+H}" class="k f"/>`+
  `<polyline points="${x0+W-a},${y0} ${x0+W},${y0} ${x0+W},${y0+b}" class="s"/>`+tx(x0+W/2,y0+H+20,de(d.L))+tx(x0-8,y0+H/2+5,de(d.B),'end')+tx(fx(x0+(W-a)/2,1),y0-8,de(d.ob))+tx(x0+W+8,fx(y0+b+(H-b)/2+5,1),de(d.re),'start'))}}
function bild8(d){return{cap:'Wendeplatz von oben; Maße in m',svg:svg(340,190,`<path d="M250,45 L60,45 L60,155 L250,155 A55,55 0 0 0 250,45" class="k f"/><line x1="250" y1="45" x2="250" y2="155" class="s"/>`+
  tx(155,37,de(d.ra))+tx(52,105,de(d.rb),'end'))}}
function bildZ(d){return{cap:'Schachtring von oben; Maße in m und cm',svg:svg(280,235,`<circle cx="140" cy="120" r="92" class="k f"/><circle cx="140" cy="120" r="68" class="k" style="fill:#fff"/>`+
  massH(72,208,120,de(d.di),'o')+massH(208,232,120,kz(d.wand),'u'))}}

/* ---------- Aufgaben ---------- */
function F(soll,nach,p,o){o=o||{};return{soll:soll,nach:nach,p:p,tol:o.tol||0.005,vor:o.vor||'',alt:o.alt||[],folge:o.folge||null,fmt:o.fmt||'de'}}
function zeig(f){return(f.fmt==='kz'?kz(f.soll):de(f.soll))+(f.nach?NB+f.nach:'')}
const BU='abcdefghij';

function A1(a){
  const teile=a.map((z,i)=>({k:BU[i],felder:[F(um(z[0],z[1],z[2]),z[2],1,{vor:E(z[0],z[1])+' =',fmt:'kz'})]}));
  const weg=a.map((z,i)=>{const T=z[1] in LEN?LEN:FL,f=T[z[1]]/T[z[2]];return `${BU[i]}) ${E(z[0],z[1])} ${f>1?'· '+kz(f):': '+kz(1/f)} = <b>${E(um(z[0],z[1],z[2]),z[2])}</b>`});
  return{nr:'1',titel:'Einheiten umrechnen',pkt:10,uebe:'Blatt 1, Aufgabe 1; Blatt 2, Aufgabe 1',kopf:'<b>Rechne um.</b> Trage das Ergebnis in das Feld ein.',
    bloecke:[{raster:true,teile:teile,hilfen:['Längen: mm → cm → dm → m. Von Stufe zu Stufe ist es der Faktor 10; von m zu km der Faktor 1'+NB+'000.',
      'Flächen: mm² → cm² → dm² → m². Von Stufe zu Stufe ist es der Faktor 100.',
      'Zur kleineren Einheit: mal rechnen, die Zahl wird größer. Zur größeren Einheit: geteilt rechnen, die Zahl wird kleiner.'],weg:weg}]}}

function A2(d,nr){
  const inM=d.teile.map(t=>um(t[0],t[1],'m')),sum=fx(inM.reduce((x,y)=>x+y,0),4),s=um(d.sand,'cm','m'),r=um(d.rohr,'mm','m'),x=fx(d.tiefe-s-r,4);
  const reihe=d.teile.map(t=>(t[1]==='m'?de(t[0]):kz(t[0]))+NB+t[1]).join('; ');
  const wegA=[];d.teile.forEach((t,i)=>{if(t[1]!=='m')wegA.push(`${E(t[0],t[1])} = ${M(inM[i])}`)});wegA.push(inM.map(M).join(' + ')+` = <b>${M(sum)}</b>`);
  return{nr:'2',titel:'Leitung und Rohr im Graben',pkt:9,uebe:'Blatt 1, Aufgabe 3 und 4',kopf:`Baustelle Tannenstraße Nr.${NB}${nr}: Die Kolonne verlegt eine neue Leitung.`,bloecke:[
    {teile:[{k:'a',text:`Der Polier misst die Leitung in vier Teilstücken:<span class="reihe">${reihe}</span><b>Berechne</b> die Gesamtlänge der Leitung in m.`,felder:[F(sum,'m',5)]}],
     hilfen:['Rechne zuerst jedes Teilstück einzeln in Meter um.','cm → m: geteilt durch 100; mm → m: geteilt durch 1'+NB+'000; dm → m: geteilt durch 10.','Addiere dann die vier Längen in Meter.'],weg:wegA},
    {teile:[{k:'b',text:'Ein Rohr liegt im Graben auf einem Sandbett (Skizze). <b>Berechne</b> die Überdeckung x in m. Die Überdeckung ist der Abstand von der Rohroberkante bis zur Geländeoberkante.',bild:bild2(d),felder:[F(x,'m',4,{vor:'x ='})]}],
     hilfen:['Bringe alle drei Maße in Meter: Grabentiefe, Sandbett und Rohrdurchmesser.','Das Rohr liegt auf dem Sandbett. Unter der Rohroberkante liegen also das Sandbett und das Rohr.',fo('x = Grabentiefe − Sandbett − Rohrdurchmesser')],
     weg:[`Sandbett: ${E(d.sand,'cm')} = ${M(s)}`,`Rohr: ${E(d.rohr,'mm')} = ${M(r)}`,`x = ${M(d.tiefe)} − ${M(s)} − ${M(r)} = <b>${M(x)}</b>`]}]}}

function A3(d,nr){
  const re=fx(d.B-d.ch,4),ob=fx(d.L-d.cw,4),r1=fx(d.L*re,4),r2=fx(ob*d.ch,4),A=fx(r1+r2,4),U=fx(2*d.L+2*d.B,4),st=fx(A*49,2),stE=fx(d.ers*49,2);
  return{nr:'3',titel:'Hof pflastern',pkt:12,uebe:'Blatt 2, Aufgabe 2 bis 4',kopf:`Hinter dem Haus Nr.${NB}${nr} wird der Hof neu gepflastert. Die Skizze zeigt den Hof von oben.`,bild:bild3(d),bloecke:[
    {teile:[{k:'a',text:'<b>Zerlege</b> den Hof in zwei Rechtecke. <b>Berechne</b> die Fläche des Hofs in m².',felder:[F(A,'m²',6)]}],
     hilfen:['Zeichne am Einschnitt eine waagerechte Linie. So entstehen zwei Rechtecke.','Unteres Rechteck: untere Seite mal rechte Seite. Oberes Rechteck: obere Seite mal Einschnitt senkrecht.','Rechteck: '+fo('A = a · b')+' Addiere beide Flächen.'],
     weg:[`Rechteck 1 (unten): ${M(d.L)} · ${M(re)} = ${M2(r1)}`,`Rechteck 2 (oben): ${M(ob)} · ${M(d.ch)} = ${M2(r2)}`,`A = ${M2(r1)} + ${M2(r2)} = <b>${M2(A)}</b>`]},
    {teile:[{k:'b',text:'Der Hof bekommt rundherum eine Einfassung aus Randsteinen. <b>Berechne</b> die Länge der Einfassung in m.',felder:[F(U,'m',4)]}],
     hilfen:['Die Einfassung läuft einmal außen herum. Das ist der Umfang.','Addiere alle sechs Seiten aus der Skizze.'],
     weg:['U = '+[d.L,re,d.cw,d.ch,ob,d.B].map(M).join(' + ')+` = <b>${M(U)}</b>`]},
    {ersatz:`Falls a) fehlt: Rechne in c) mit ${M2(d.ers)} weiter.`,teile:[{k:'c',text:'Für 1'+NB+'m² Pflaster braucht man 49 Steine. <b>Berechne</b> die Anzahl der Steine für den Hof.',felder:[F(st,'Steine',2,{fmt:'kz',tol:0.5,alt:[{v:stE}],folge:a=>a['3a0']*49})]}],
     hilfen:['Du brauchst die Fläche aus a). Fehlt sie dir, nimm den Ersatzwert.',fo('Steine = Fläche · 49 Steine je m²')],
     weg:[`${M2(A)} · 49 Steine/m² = <b>${kz(st)} Steine</b>`,`Mit dem Ersatzwert: ${M2(d.ers)} · 49 Steine/m² = ${kz(stE)} Steine`]}]}}

function A4(d,nr){
  const ras=[],wegR=[];
  d.r.forEach((z,i)=>{if(z[1]==='P'){const w=fx(z[2]*z[0]/100,4);ras.push({k:BU[i],felder:[F(w,'m',1,{vor:`1 : ${z[0]}; P = ${E(z[2],'cm')}; W =`})]});wegR.push(`${BU[i]}) ${E(z[2],'cm')} · ${z[0]} = ${E(z[2]*z[0],'cm')} = <b>${M(w)}</b>`)}
    else{const p=fx(z[2]*100/z[0],4);ras.push({k:BU[i],felder:[F(p,'cm',1,{vor:`1 : ${z[0]}; W = ${M(z[2])}; P =`,fmt:'kz'})]});wegR.push(`${BU[i]}) ${M(z[2])} = ${E(z[2]*100,'cm')}; ${E(z[2]*100,'cm')} : ${z[0]} = <b>${E(p,'cm')}</b>`)}});

/* ---------- Bewertung ---------- */
function bewerteBlock(t,b,antw,mc){
  const num={};for(const k in antw)num[k]=lies(antw[k]);const res=[];
  b.teile.forEach(te=>{
    if(te.mc){const id=t.nr+te.k,g=mc[id];res.push({id:id,te:te,typ:'mc',status:g==null?'leer':(g===te.mc.richtig?'ok':'falsch'),p:te.p,soll:te.mc.opts[te.mc.richtig],ein:g==null?'':te.mc.opts[g]})}
    else te.felder.forEach((f,fi)=>{const id=t.nr+te.k+fi,roh=antw[id],v=num[id];let st='falsch';
      if(roh==null||String(roh).trim()==='')st='leer';else if(ok(v,f.soll,f.tol))st='ok';else if(f.alt.some(a=>ok(v,a.v,f.tol)))st='ersatz';
      else if(f.folge){const fv=f.folge(num);if(isFinite(fv)&&ok(v,fv,Math.max(f.tol,Math.abs(fv)*0.0006)))st='folge'}
      res.push({id:id,te:te,f:f,typ:'feld',status:st,p:f.p,soll:zeig(f),ein:roh==null?'':String(roh)})})});
  return res}
const zaehlt=s=>s==='ok'||s==='ersatz'||s==='folge';
function bewerte(t,antw,mc){let r=[];t.bloecke.forEach(b=>{r=r.concat(bewerteBlock(t,b,antw,mc))});return r}

function titelZeile(t){return(t.nr==='Z'?'Zusatzaufgabe':'Aufgabe '+t.nr)+': '+t.titel}
function htmlAufgabe(t,modus,antw,mc){
  antw=antw||{};mc=mc||{};

  t.bloecke.forEach((b,bi)=>{
    h+=`<div class="block" data-b="${bi}">`;if(b.kopf)h+=`<p>${b.kopf}</p>`;if(b.bild)h+=fig(b.bild);if(b.ersatz)h+=`<p class="ersatz">↳ ${b.ersatz}</p>`;if(b.raster)h+='<div class="gitter">';
    b.teile.forEach(te=>{
      h+='<div class="teil">';if(te.text)h+=`<p><b>${te.lab||te.k+')'}</b> ${te.text}</p>`;if(te.bild)h+=fig(te.bild);
      if(te.mc){const id=t.nr+te.k;te.mc.opts.forEach((o,oi)=>{h+=modus==='druck'?`<p>☐ ${o}</p>`:`<label class="opt" id="o-${id}-${oi}"><input type="radio" name="mc-${id}" data-mc="${id}" value="${oi}"${mc[id]===oi?' checked':''}>${o}</label>`})}
      else te.felder.forEach((f,fi)=>{const id=t.nr+te.k+fi,vor=(b.raster?`<b>${te.k})</b> `:'')+(f.vor||'');
        h+=modus==='druck'?`<div class="feld">${vor} <span class="leer"></span> ${f.nach}</div>`:`<div class="feld"><label>${vor} <span class="eu"><input type="text" inputmode="decimal" autocomplete="off" data-id="${id}" value="${esc(antw[id])}" aria-label="Ergebnis ${te.k}"> ${f.nach}</span></label><span class="mark" id="m-${id}"></span></div>`});
      h+='</div>'});
    if(b.raster)h+='</div>';
    if(modus==='druck'&&!b.raster)h+='<div class="rechenfeld"></div>';
    if(modus==='ueben')h+=`<div class="steuer" id="st-${bi}">${steuer(bi)}</div>`;
    h+='</div>'});
  return h+'</section>'}

    det+=`<details class="card"><summary>${titelZeile(t)}: ${kz(got)} von ${t.pkt} Punkten${schwach?' (üben!)':''}</summary>`;
    t.bloecke.forEach(b=>{const r=bewerteBlock(t,b,p.antw,p.mc);
      det+='<div class="block">'+r.map(x=>{const lab=x.te.lab||x.te.k+')',vor=x.f&&x.f.vor?' '+x.f.vor:'';

        if(x.status==='ersatz')return `<p><b>${lab}</b>${vor} <span class="mark ok">✓</span> ${esc(x.ein)}: mit dem Ersatzwert richtig gerechnet.</p>`;
        if(x.status==='folge')return `<p><b>${lab}</b>${vor} <span class="mark ok">✓</span> ${esc(x.ein)}: mit deinem eigenen Wert richtig weitergerechnet. Mit dem richtigen Wert davor wäre es ${x.soll}.</p>`;
        return `<p><b>${lab}</b>${vor} <span class="mark falsch">✗</span> ${esc(x.ein)} ist falsch. Richtig ist: <b>${x.soll}</b></p>`}).join('')+
        `<div class="loes"><div class="loes-kopf">Lösungsweg</div>${b.weg.map(z=>`<div class="zeile">${z}</div>`).join('')}</div></div>`});

function neuU(nr){return{nr:nr,t:GEN[nr](),antw:{},mc:{},h:{},auf:{},versucht:{},wegAuf:{},fb:{},gez:{}}}
function steuer(bi){
  const b=U.t.bloecke[bi],n=U.h[bi]||0;let h='<div class="knopfe nodruck"><button class="pruef" data-akt="pruefen" data-b="'+bi+'">Prüfen</button>';

  const frei=U.versucht[bi]||n>=b.hilfen.length;
  h+=`<button class="wegknopf" data-akt="weg" data-b="${bi}"${frei?'':' disabled'}>Lösungsweg${U.wegAuf[bi]?' ▲':''}</button></div>`;
  if(!frei)h+='<p class="klein nodruck">Der Lösungsweg öffnet sich nach dem Prüfen oder nach der letzten Hilfe.</p>';
  if(U.fb[bi])h+=U.fb[bi];
  b.hilfen.forEach((x,hi)=>{if(U.auf[bi+'-'+hi])h+=`<div class="hilfe h${hi+1}"><b>Hilfe ${hi+1}:</b> ${x}</div>`});
  if(U.wegAuf[bi])h+=`<div class="loes"><div class="loes-kopf">Lösungsweg</div>${b.weg.map(z=>`<div class="zeile">${z}</div>`).join('')}</div>`;
  return h}
